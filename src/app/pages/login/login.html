<div class="d-flex align-items-center justify-content-center vh-100" style="background: linear-gradient(135deg, #FF6B4A 0%, #C02425 100%);">
    <div class="card p-5 shadow-lg rounded-4" style="width: 420px; border: none;">
        
        <div class="text-center mb-4">
            <h2 class="fw-bold" style="color: #E85D38;"><i class="fa-solid fa-user-doctor"></i> SIS-QUIRO</h2>
            <p class="text-muted">Acceso al Sistema Médico</p>
        </div>

        <form #formLogin="ngForm" (ngSubmit)="ingresar()">
            <div class="mb-3">
                <label class="fw-bold text-dark">Correo Electrónico</label>
                <input type="email" name="email" class="form-control form-control-lg rounded-pill fs-6" 
                       required [(ngModel)]="credenciales.email">
            </div>
            
            <div class="mb-4">
                <label class="fw-bold text-dark">Contraseña</label>
                <input type="password" name="clave" class="form-control form-control-lg rounded-pill fs-6" 
                       required [(ngModel)]="credenciales.clave">
            </div>
            
            <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold" 
                    [disabled]="formLogin.invalid" style="background: linear-gradient(135deg, #FF6B4A 0%, #C02425 100%); border: none;">
                INGRESAR
            </button>
        </form>

    </div>
</div>
